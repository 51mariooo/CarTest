name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project CarTest.xcodeproj -target CarTest \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA (with CarPlay entitlement embedded)
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CarTest.app Payload/
          codesign --force --sign - --entitlements Config/CarTest.entitlements Payload/CarTest.app
          zip -qry CarTest.ipa Payload

      - name: Publish release (easy download on iPhone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CarTest build ${{ github.run_number }}
          files: CarTest.ipa

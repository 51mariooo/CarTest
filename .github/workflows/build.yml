name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Try two kinds of GitHub Mac at once; whichever is free first wins.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project CarMirror.xcodeproj -target CarMirror \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: |BUILD" || true
          test -d build/Release-iphoneos/CarMirror.app

      - name: Package IPA (with CarPlay entitlement embedded)
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CarMirror.app Payload/
          ls Payload/CarMirror.app/PlugIns
          codesign --force --sign - Payload/CarMirror.app/PlugIns/*.appex
          codesign --force --sign - --entitlements Config/CarMirror.entitlements Payload/CarMirror.app
          zip -qry CarMirror.ipa Payload

      - name: Publish release (easy download on iPhone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CarMirror build ${{ github.run_number }}
          files: CarMirror.ipa
          overwrite_files: true

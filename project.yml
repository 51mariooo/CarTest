name: CarMirror
options:
  bundleIdPrefix: com.mario
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  CarMirror:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - target: CarMirrorBroadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mario.carmirror
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/CarMirror.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CarMirrorBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mario.carmirror.broadcast
        INFOPLIST_FILE: Config/Broadcast-Info.plist
